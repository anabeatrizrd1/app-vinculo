<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Acesso</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../acesso/acesso.css">
</head>
<body>
    <main class="cadastrar-ong">
        <div class="mensagemCadastro"></div>
        <form class="ca">
            <h1 class="titulo">Quero cadastrar minha ONG</h1>
            <div class= "cadastro">
                <label>E-mail:</label>
                <input type="email" class="email-ong" placeholder ="Digite aqui..." name="email" required>
            </div>
            <div class="cadastro">
                <label>Senha:</label>
                <input type="password" class="senha-ong" placeholder ="Mínimo de 6 caracteres" name="senha" minlength="6" required>
                <a href="../esqueci-senha/esqueci-senha.html" id="esqueci-senha">Esqueci minha senha</a>
            </div>
                <button type="button" class="confirmar-cadastro">Confirmar</button>
            <div class="login">
                <a href="#" class="alterar-login">Já tenho minha ONG cadastrada</a>
            </div>
        </form>
    </main>
</body>
<script type="module" src="./acesso.js"></script>
