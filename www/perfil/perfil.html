<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="perfil.css">
</head>
<body>
    <main id="main">
<div id="cor">
            <h1 id="topo">VíNCULO</h1>
        </div>
        <h1 id="titulo">Cadastre sua ONG aqui!</h1>
        <form id="dados">
            <label for="nome">Nome da organização:</label> <br>
            <input type="text" name="nome" placeholder="Digite aqui..."> <br>

            <label for="endereco">Endereço:</label> <br>
            <input type="text" name="endereco" placeholder="Endereço completo e (caso houver) ponto de referência"> <br>

            <label for="recursos">Recursos necessários:</label> <br>

            <label for="urgente" class="itens">Urgente</label> 
            <input type="text" name="urgente" placeholder="Acabou ou está acabando"> <br>

            <label for="algumas" class="itens">Algumas unidades</label> 
            <input type="text" name="algumas" placeholder="Tem necessidade média"> <br>

            <label for="voluntario" class="itens">Voluntário</label> 
            <input type="text" name="voluntario" placeholder="Tem necessidade baixa"> <br>

            <label for="contato">Contato:</label> <br>
            <input type="text" name="contato" placeholder="Telefone, whatsapp, email..."> <br>

            <label for="sobre">Sobre a ONG:</label> <br>
            <input type="text" name="sobre" id="sobre" placeholder="Com o que trabalha, como começou, quem fundou..."> <br>
        </form>
         <div id="telas">
            <button type="button" class="feed">ONGs e Doações</button>
            <button type="button" class="confirmar-dados">Confirmar</button>
        </div>
    </main>
</body>
<script type="module" src="../js/perfil.js"></script>
